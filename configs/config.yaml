project:
  name: churn-mlops
  seed: 42

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: churn-prediction
  registered_model_name: churn-classifier

data:
  target: churned
  n_train: 20000
  test_size: 0.2
  min_rows: 1000

# Data contract: every training batch is validated against this schema
schema:
  numeric:
    tenure_months:      {min: 0,   max: 120,  max_null: 0.0}
    monthly_charges:    {min: 10,  max: 250,  max_null: 0.0}
    total_charges:      {min: 0,   max: 30000, max_null: 0.0}
    num_support_calls:  {min: 0,   max: 30,   max_null: 0.0}
    usage_gb:           {min: 0,   max: 2000, max_null: 0.02}
    age:                {min: 18,  max: 100,  max_null: 0.0}
  categorical:
    contract_type:    {allowed: [month-to-month, one-year, two-year], max_null: 0.0}
    payment_method:   {allowed: [credit_card, bank_transfer, electronic_check, mailed_check], max_null: 0.0}
    internet_service: {allowed: [fiber, dsl, none], max_null: 0.0}
  target:
    name: churned
    allowed: [0, 1]
    min_positive_rate: 0.03
    max_positive_rate: 0.70

training:
  min_auc_to_accept: 0.70      # quality gate: fail the pipeline below this
  cv_folds: 3
  candidates:
    logistic_regression:
      C: 1.0
      max_iter: 500
    random_forest:
      n_estimators: 200
      max_depth: 10
      min_samples_leaf: 5
    hist_gradient_boosting:
      max_iter: 200
      learning_rate: 0.08
      max_depth: 6

# ---- Part 2: registry + promotion policy -----------------------------------
registry:
  champion_alias: champion
  challenger_alias: challenger
  # Fixed "golden" evaluation set. Every candidate is judged on the SAME data,
  # so version-to-version comparisons are apples to apples.
  eval_rows: 6000
  eval_seed: 1234
  promotion:
    min_auc_improvement: 0.002     # challenger must beat champion by at least this
    max_recall_drop: 0.03          # guardrail: don't trade away recall
    max_brier_increase: 0.005      # guardrail: calibration must not get worse
    require_significance: false    # if true, bootstrap CI lower bound must be > 0
    bootstrap_samples: 300
    confidence: 0.95

# ---- Part 3: serving -------------------------------------------------------
serving:
  threshold: 0.5               # probability >= threshold -> predicted churn
  risk_bands: [0.30, 0.60]     # low < 0.30 <= medium < 0.60 <= high
  max_batch: 500
  refresh_seconds: 30          # poll the registry for a new champion (0 = off)
  database_url: sqlite:///serving.db   # override with DATABASE_URL (PostgreSQL in prod)

# ---- Part 4: safe rollout (shadow + A/B) -----------------------------------
deployment:
  salt: churn-ab-v1                 # changing the salt re-shuffles who sees which model
  state_cache_seconds: 2            # how long a replica caches the rollout state
  safety_min_auc: 0.70              # hard floor on the golden set before ANY live exposure
  max_ab_split: 0.5                 # a challenger may never get a majority of traffic
  auto_ab_split: 0.2                # share used when the controller advances shadow -> A/B
  experiment:
    min_labeled_per_arm: 300        # don't judge before this much labeled evidence
    alpha: 0.05
    srm_alpha: 0.001                # sample-ratio-mismatch check (broken randomisation)
    max_latency_ratio: 1.5          # challenger p95 may be at most 1.5x champion p95 ...
    max_latency_slack_ms: 25        # ... or champion p95 + 25 ms, whichever is larger
    max_shadow_error_rate: 0.01
    max_duration_hours: 72          # an inconclusive experiment is stopped, not left running forever
    bootstrap_samples: 300
    confidence: 0.95

# ---- Part 5: monitoring + automated retraining -----------------------------
monitoring:
  window_rows: 1500          # most recent champion predictions examined for DATA drift (no labels needed)
  min_rows: 200
  interval_seconds: 0        # >0 => the API runs the monitor itself; the worker normally does (env MONITORING_INTERVAL_SECONDS)
  drift:
    psi_warn: 0.10           # industry rule of thumb: <0.1 stable, 0.1-0.25 moderate, >0.25 major shift
    psi_crit: 0.25
    ks_alpha: 0.01
    null_delta_warn: 0.03    # change in missing-value rate (absolute)
    null_delta_crit: 0.10
    critical_feature_share: 0.2   # drift is "critical" when >= 20 % of features are critical
  performance:               # needs delayed labels
    window_labeled: 1000
    min_labeled: 150
    auc_drop_warn: 0.03
    auc_drop_crit: 0.07
    calib_gap_warn: 0.05     # |mean predicted churn - actual churn rate|
    calib_gap_crit: 0.10
    logloss_increase_warn: 0.10
    logloss_increase_crit: 0.25

retraining:
  enabled: true
  min_labeled_rows: 1500     # never retrain on a thin slice of reality
  max_rows: 6000             # most recent labeled production rows
  lookback_days: 30
  cooldown_hours: 24         # don't thrash: at most one automatic retrain per cooldown
