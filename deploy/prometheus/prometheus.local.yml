# Same as prometheus.yml, but scrapes an API running on your HOST (make serve) from inside Docker.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: {project: mlops-platform}

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: mlops-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels: {service: churn-api}
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
