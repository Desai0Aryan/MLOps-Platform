# Prometheus config for the full Docker Compose stack (Part 7): the API is reachable as `api:8000`.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: {project: mlops-platform}

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: mlops-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: {service: churn-api}
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
